name: CI

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

jobs:
  build-and-test:
    # 26.04 é a primeira LTS com pacote do SDL3 (libsdl3-dev 3.4.x)
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libsdl3-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Run tests
        run: cargo test --all --verbose

      - name: Fetch Mooneye ROMs
        run: ./scripts/fetch_mooneye_roms.sh

      - name: Run Blargg and Mooneye ROMs
        run: |
          set -o pipefail
          ./run_all_tests.sh all 2>&1 | tee rom-test-results.log

      - name: Upload ROM test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rom-test-results
          path: rom-test-results.log
          if-no-files-found: ignore
