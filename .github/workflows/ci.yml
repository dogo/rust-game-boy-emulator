name: CI

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential git cmake libasound2-dev libpulse-dev libaudio-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxinerama-dev libxss-dev libwayland-dev libxkbcommon-dev libdrm-dev libgbm-dev libudev-dev libegl1-mesa-dev libgles2-mesa-dev libxtst-dev

      - name: Detect SDL3 version from Cargo.lock
        id: sdl3ver
        run: |
          # sdl3-sys grava a versão como "+SDL3-x.y.z" (até 0.5) ou "+SDL-x.y.z" (0.6+)
          SDL3_VER=$(grep -oP '\+SDL3?-\K[0-9]+\.[0-9]+\.[0-9]+' Cargo.lock | head -n1)
          test -n "$SDL3_VER"
          echo "version=$SDL3_VER" >> $GITHUB_OUTPUT
      - name: Download SDL3 source (dynamic version)
        run: git clone --depth 1 --branch release-${{ steps.sdl3ver.outputs.version }} https://github.com/libsdl-org/SDL.git SDL3

      - name: Build and install SDL3
        run: |
          cd SDL3
          mkdir build
          cd build
          cmake .. -DSDL_STATIC=OFF -DSDL_SHARED=ON -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)
          sudo make install
          sudo ldconfig

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Run tests
        run: cargo test --all --verbose

      - name: Fetch Mooneye ROMs
        run: ./scripts/fetch_mooneye_roms.sh

      - name: Run Blargg and Mooneye ROMs
        run: |
          set -o pipefail
          ./run_all_tests.sh all 2>&1 | tee rom-test-results.log

      - name: Upload ROM test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rom-test-results
          path: rom-test-results.log
          if-no-files-found: ignore
